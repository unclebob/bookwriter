[[permission]]
identifier = "book-access"
description = "Read and write the open book folder."
commands.allow = [
  "read_text",
  "read_bytes",
  "write_text",
  "read_dir",
  "rename_path",
  "make_dir",
  "canonicalize_path",
  "move_file",
  "remove_path",
  "allow_book",
  "startup_book_path",
  "pandoc_docx",
  "set_open_book",
  "ensure_companion",
  "stop_companion",
  "read_refresh",
  "write_place",
  "clear_place",
]
